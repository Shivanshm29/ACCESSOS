<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACCESSOS Test Sandbox Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      line-height: 1.5;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
    }
    input, textarea, select, button {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .nav-links {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ACCESSOS Verification Sandbox</h1>
    <p>Deterministic page designed for browser extension shell & metadata connection verification.</p>

    <!-- Test Inputs (2) -->
    <div class="form-group">
      <label for="input-username">Username</label>
      <input type="text" id="input-username" name="username" placeholder="Enter username" />
    </div>
    <div class="form-group">
      <label for="input-email">Email Address</label>
      <input type="email" id="input-email" name="email" placeholder="user@example.com" />
    </div>

    <!-- Test Textarea (1) -->
    <div class="form-group">
      <label for="input-notes">Notes</label>
      <textarea id="input-notes" name="notes" rows="3" placeholder="Enter accessibility preferences"></textarea>
    </div>

    <!-- Test Select (1) -->
    <div class="form-group">
      <label for="select-language">Preferred Language</label>
      <select id="select-language" name="language">
        <option value="en">English</option>
        <option value="es">Spanish</option>
      </select>
    </div>

    <!-- Test Buttons (2) -->
    <div class="button-group">
      <button type="button" id="btn-cancel">Cancel</button>
      <button type="submit" id="btn-submit">Submit</button>
    </div>

    <!-- Test Links (3) -->
    <div class="nav-links">
      <a href="#home" id="link-home">Home</a>
      <a href="#about" id="link-about">About</a>
      <a href="#help" id="link-help">Help</a>
    </div>
  </div>
</body>
</html>
