services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessos-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - LOG_LEVEL=INFO
      - AI_PROVIDER=mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  demo-site:
    image: nginx:alpine
    container_name: accessos-demo-site
    ports:
      - "3000:80"
    volumes:
      - ./demo-site:/usr/share/nginx/html:ro
    restart: unless-stopped
